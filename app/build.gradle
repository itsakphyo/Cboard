plugins {
    id 'com.android.application'
}

android {
    namespace 'com.burmese.keyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.burmese.keyboard'
        minSdk 21
        targetSdk 34
        versionCode 13
        versionName '0.5.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
